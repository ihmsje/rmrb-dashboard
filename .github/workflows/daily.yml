name: Daily People's Daily update

# Runs every morning, plus on-demand via the "Run workflow" button.
# NOTE: GitHub cron is UTC. 06:00 UTC ≈ early morning in Europe and a safe time
# (today's edition is long published in Beijing, UTC+8). Adjust to your timezone.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Allow committing refreshed data back to the repo and deploying to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't let two runs deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape + translate today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_update.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build static site
        run: python build_static.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
